{% extends 'base.html' %}

{% block title %}{{ title }} - BusinessOS{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header Banner -->
    <div class="glass-card p-6 rounded-2xl flex items-center justify-between border border-slate-200">
        <div>
            <h3 class="font-bold text-slate-900 text-lg font-display">{{ title }}</h3>
            <p class="text-xs text-slate-500 mt-1">Completa los datos del cliente para la gestión comercial y CRM</p>
        </div>
        <a href="{% url 'client_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
            ← Volver al Listado
        </a>
    </div>

    <!-- Full Page Form -->
    <div class="glass-card p-8 rounded-2xl border border-slate-200 space-y-6">
        <form method="POST" autocomplete="off" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre</label>
                    <input type="text" name="first_name" value="{{ client.first_name|default:'' }}" placeholder="Ej: Juan" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Apellido</label>
                    <input type="text" name="last_name" value="{{ client.last_name|default:'' }}" placeholder="Ej: Pérez" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">WhatsApp / Teléfono</label>
                    <input type="tel" name="phone" value="{{ client.phone|default:'' }}" placeholder="+5491133221100" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ client.email|default:'' }}" placeholder="juan@email.com" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">RUT / RFC / NIF Fiscal</label>
                    <input type="text" name="tax_id" value="{{ client.tax_id|default:'' }}" placeholder="Ej: 20-33445566-9" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Estado del Cliente</label>
                    <select name="status" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                        <option value="ACTIVE" {% if client and client.status == 'ACTIVE' %}selected{% endif %}>Activo</option>
                        <option value="VIP" {% if client and client.status == 'VIP' %}selected{% endif %}>Cliente VIP / Frecuente</option>
                        <option value="INACTIVE" {% if client and client.status == 'INACTIVE' %}selected{% endif %}>Inactivo (+60 días)</option>
                        <option value="PROSPECT" {% if client and client.status == 'PROSPECT' %}selected{% endif %}>Prospecto</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Dirección</label>
                <input type="text" name="address" value="{{ client.address|default:'' }}" placeholder="Ej: Av. Corrientes 1234, CABA" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notas y Preferencias Personales</label>
                <textarea name="notes" rows="3" placeholder="Ej: Prefiere turnos por la mañana, café solo..." class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">{{ client.notes|default:'' }}</textarea>
            </div>

            <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                <a href="{% url 'client_list' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-sm font-bold shadow-md shadow-rose-950/20 transition">
                    Guardar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
