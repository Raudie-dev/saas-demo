{% extends 'base.html' %}

{% block title %}{{ title }} - BusinessOS{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="glass-card p-6 rounded-2xl flex items-center justify-between border border-slate-200">
        <div>
            <h3 class="font-bold text-slate-900 text-lg font-display">{{ title }}</h3>
            <p class="text-xs text-slate-500 mt-1">Registra proveedores para el control de insumos y gastos operativos</p>
        </div>
        <a href="{% url 'supplier_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
            ← Volver a Proveedores
        </a>
    </div>

    <div class="glass-card p-8 rounded-2xl border border-slate-200 space-y-6">
        <form method="POST" autocomplete="off" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Razón Social / Nombre del Proveedor</label>
                <input type="text" name="company_name" value="{{ supplier.company_name|default:'' }}" placeholder="Ej: Distribuidora Grooming Pro" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Persona de Contacto</label>
                    <input type="text" name="contact_name" value="{{ supplier.contact_name|default:'' }}" placeholder="Roberto Gómez" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">RUT / RFC / Tax ID</label>
                    <input type="text" name="tax_id" value="{{ supplier.tax_id|default:'' }}" placeholder="30-71122334-5" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teléfono</label>
                    <input type="tel" name="phone" value="{{ supplier.phone|default:'' }}" placeholder="+54 11 4433-2211" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                    <input type="email" name="email" value="{{ supplier.email|default:'' }}" placeholder="ventas@proveedor.com" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
                <input type="text" name="category" value="{{ supplier.category|default:'Insumos Generales' }}" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
            </div>

            <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                <a href="{% url 'supplier_list' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-sm font-bold shadow-md shadow-rose-950/20 transition">Guardar Proveedor</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
