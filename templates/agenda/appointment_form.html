{% extends 'base.html' %}

{% block title %}{{ title }} - BusinessOS{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="glass-card p-6 rounded-2xl flex items-center justify-between border border-slate-200">
        <div>
            <h3 class="font-bold text-slate-900 text-lg font-display">{{ title }}</h3>
            <p class="text-xs text-slate-500 mt-1">Selecciona el cliente, servicio, especialista y horario de la cita</p>
        </div>
        <a href="{% url 'agenda' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
            ← Volver a la Agenda
        </a>
    </div>

    <div class="glass-card p-8 rounded-2xl border border-slate-200 space-y-6">
        <form method="POST" autocomplete="off" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Cliente</label>
                <select name="client_id" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                    <option value="" disabled {% if not appointment and not selected_client_id %}selected{% endif %}>Seleccionar Cliente</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}" {% if appointment and appointment.client.id == client.id or selected_client_id == client.id|stringformat:"s" %}selected{% endif %}>{{ client.full_name }} ({{ client.phone }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Servicio a Realizar</label>
                    <select name="service_id" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                        <option value="" disabled {% if not appointment and not selected_service_id %}selected{% endif %}>Seleccionar Servicio</option>
                        {% for srv in services %}
                        <option value="{{ srv.id }}" {% if appointment and appointment.service.id == srv.id or selected_service_id == srv.id|stringformat:"s" %}selected{% endif %}>{{ srv.name }} - {{ business.currency }}{{ srv.price }} ({{ srv.duration_minutes }} min)</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Especialista / Profesional</label>
                    <select name="staff_id" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                        <option value="" disabled {% if not appointment and not selected_staff_id %}selected{% endif %}>Seleccionar Especialista</option>
                        {% for staff in staff_members %}
                        <option value="{{ staff.id }}" {% if appointment and appointment.staff.id == staff.id or selected_staff_id == staff.id|stringformat:"s" %}selected{% endif %}>{{ staff.full_name }} ({{ staff.role_title }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha</label>
                    <input type="date" name="date" value="{% if appointment %}{{ appointment.date|date:'Y-m-d' }}{% else %}{{ today_date }}{% endif %}" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Hora Inicio</label>
                    <input type="time" name="start_time" value="{% if appointment %}{{ appointment.start_time }}{% else %}{{ selected_time }}{% endif %}" placeholder="10:00" required class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Estado de Cita</label>
                    <select name="status" class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">
                        <option value="CONFIRMED" {% if not appointment or appointment.status == 'CONFIRMED' %}selected{% endif %}>Confirmada</option>
                        <option value="COMPLETED" {% if appointment and appointment.status == 'COMPLETED' %}selected{% endif %}>Realizada / Finalizada</option>
                        <option value="PENDING" {% if appointment and appointment.status == 'PENDING' %}selected{% endif %}>Pendiente</option>
                        <option value="CANCELLED" {% if appointment and appointment.status == 'CANCELLED' %}selected{% endif %}>Cancelada</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notas de la Cita</label>
                <textarea name="notes" rows="3" placeholder="Observaciones especiales..." class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-800">{{ appointment.notes|default:'' }}</textarea>
            </div>

            <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                <a href="{% url 'agenda' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-sm font-bold shadow-md shadow-rose-950/20 transition">Guardar Turno</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
