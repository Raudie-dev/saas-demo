<!DOCTYPE html>
<html lang="es" class="h-full scroll-smooth bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Restablecida - RauDie OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen font-sans antialiased bg-slate-50 text-slate-900 flex flex-col justify-between p-4 sm:p-6 relative overflow-y-auto">

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-gradient-to-tr from-emerald-900/15 via-emerald-200/40 to-slate-200/30 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md mx-auto my-auto space-y-5 relative z-10">
        
        <div class="text-center space-y-2">
            <a href="{% url 'landing' %}" class="inline-flex items-center justify-center gap-3 group">
                <img src="/static/images/logo.png" alt="RauDie OS Logo" class="w-12 h-12 drop-shadow-xl object-contain group-hover:scale-105 transition-transform">
                <span class="font-display font-black text-3xl sm:text-4xl text-slate-900 tracking-tight">RauDie<span class="text-rose-700">OS</span></span>
            </a>
        </div>

        <div class="bg-white/95 backdrop-blur-xl border border-slate-200/90 rounded-3xl p-6 sm:p-8 space-y-5 shadow-xl shadow-slate-200/50 text-center">
            
            <div class="mx-auto w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4">
                <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            
            <h2 class="text-xl font-extrabold text-slate-900 font-display">¡Contraseña Actualizada!</h2>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">
                Tu contraseña ha sido restablecida exitosamente. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>

            <a href="{% url 'login' %}" class="w-full inline-block py-3 px-4 rounded-full text-xs font-bold text-slate-900 border-2 border-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-300 tracking-wider uppercase shadow-md mt-6">
                INICIAR SESIÓN
            </a>
        </div>
    </div>

    <div class="w-full text-center relative z-10 pt-4 pb-2">
        <p class="text-[11px] text-slate-500 font-medium">
            RauDie OS &copy; 2026 • CRM, Facturación & Reservas de Citas
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
