{% extends 'base.html' %}

{% block title %}Crear Campaña de Email - BusinessOS{% endblock %}
{% block header_title %}Nueva Campaña de Email{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto glass-card bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
    <div class="p-5 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
        <h3 class="font-bold text-slate-900 text-lg font-display">Detalles de la Campaña</h3>
        <a href="{% url 'email_marketing_list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-900">Volver</a>
    </div>
    <form method="POST" class="p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre de Referencia *</label>
            <input type="text" name="name" required placeholder="Ej: Promo Verano 2026" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Audiencia / Destinatarios</label>
            <select name="audience" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
                {% for code, label in audiences %}
                <option value="{{ code }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Asunto del Email *</label>
            <input type="text" name="subject" required placeholder="Ej: ¡Aprovecha nuestros descuentos!" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Cuerpo del Mensaje *</label>
            <textarea name="body" rows="6" required placeholder="Escribe el contenido de tu correo aquí..." class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition"></textarea>
            <p class="text-[11px] text-slate-500 mt-1">Soporta texto y variables básicas como {client_name}.</p>
        </div>
        
        <div class="pt-4 border-t border-slate-100 flex justify-end">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md transition flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Guardar Borrador
            </button>
        </div>
    </form>
</div>
{% endblock %}
