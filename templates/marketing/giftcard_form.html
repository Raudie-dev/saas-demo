{% extends 'base.html' %}

{% block title %}{{ title }} - BusinessOS{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="glass-card bg-white p-6 rounded-2xl flex items-center justify-between border border-slate-200 shadow-sm">
        <div>
            <h3 class="font-bold text-slate-900 text-lg font-display">{{ title }}</h3>
            <p class="text-xs text-slate-500 mt-1">Emite tarjetas de regalo precargadas para clientes o consumo general</p>
        </div>
        <a href="{% url 'marketing_dashboard' %}" class="px-4 py-2 rounded-xl bg-slate-950 hover:bg-slate-900 text-white text-xs font-semibold shadow transition">
            ← Volver a Marketing
        </a>
    </div>

    <div class="glass-card bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <form method="POST" autocomplete="off" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Código de la Gift Card</label>
                <input type="text" name="code" placeholder="Ej: GIFT-5000" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-3 text-sm font-mono uppercase focus:ring-2 focus:ring-rose-900 focus:border-rose-900">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Saldo Inicial ({{ business.currency }})</label>
                    <input type="number" step="0.01" name="amount" placeholder="50.00" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-900 focus:border-rose-900">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Cliente Titular (Opcional)</label>
                    <select name="client_id" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-900 focus:border-rose-900">
                        <option value="" selected>Al Portador</option>
                        {% for c in clients %}
                        <option value="{{ c.id }}">{{ c.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                <a href="{% url 'marketing_dashboard' %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-sm font-bold shadow-md transition">Emitir Gift Card</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
